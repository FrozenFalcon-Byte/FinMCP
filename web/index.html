<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F4F5F7" />
    <meta name="description" content="FinMCP: a personal finance tracker whose brain is an MCP server. Track money in a calm app, and let any AI assistant you already use read and write the same ledger." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Home-screen app: Safari's "Add to Home Screen" opens FinMCP full screen, like an installed app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FinMCP" />
    <title>FinMCP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Anek+Latin:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Boot veil: the page's own background colour until the app has loaded (components/Curtain.tsx takes over). -->
    <div id="boot" aria-busy="true" style="position:fixed;inset:0;z-index:1001;background:#fff"></div>
    <script>if (location.pathname.indexOf("/app") === 0) document.getElementById("boot").style.background = "#f4f5f7";</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
