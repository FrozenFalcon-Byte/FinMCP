[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finmcp"
version = "0.1.0"
description = "FinMCP: a personal finance copilot exposed as an MCP server, with an MCP-client agent, FastAPI backend and React frontend."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.2,<3",
  "anthropic>=1.6,<2",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pdfplumber>=0.11",
  "pytesseract>=0.3.10",
  "pillow>=10",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "httpx>=0.27"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
finmcp = "finmcp.__main__:main"
finmcp-agent = "agent.cli:main"

[tool.setuptools]
packages = ["finmcp", "finmcp.db", "finmcp.llm", "finmcp.services", "finmcp.ingestion", "agent", "api", "api.routes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108", "UP035"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "SIM117"]
