<title>FinMCP Build Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light;
    --page: #f3f5f8;
    --surface: #ffffff;
    --surface-2: #eaedf2;
    --ink: #141922;
    --ink-2: #4d5766;
    --muted: #8590a0;
    --hair: #e1e5eb;
    --line: #c9cfd8;
    --accent: #2a78d6;
    --accent-ink: #1c5cab;
    --accent-soft: rgba(42, 120, 214, 0.12);
    --s1: #2a78d6;
    --s2: #eb6834;
    --s2-soft: rgba(235, 104, 52, 0.14);
    --s3: #1baf7a;
    --s4: #eda100;
    --track: #d9e3f1;
    --good: #0ca30c;
    --good-text: #006300;
    --warn: #fab219;
    --crit: #d03b3b;
    --shadow: 0 1px 2px rgba(20, 25, 34, 0.06), 0 8px 24px -16px rgba(20, 25, 34, 0.25);
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0e1116;
      --surface: #161a20;
      --surface-2: #1d222a;
      --ink: #f1f3f6;
      --ink-2: #aeb6c2;
      --muted: #7f8896;
      --hair: #262c35;
      --line: #353d48;
      --accent: #3987e5;
      --accent-ink: #86b6ef;
      --accent-soft: rgba(57, 135, 229, 0.16);
      --s1: #3987e5;
      --s2: #d95926;
      --s2-soft: rgba(217, 89, 38, 0.18);
      --s3: #199e70;
      --s4: #c98500;
      --track: #232b36;
      --good-text: #0ca30c;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -16px rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0e1116;
    --surface: #161a20;
    --surface-2: #1d222a;
    --ink: #f1f3f6;
    --ink-2: #aeb6c2;
    --muted: #7f8896;
    --hair: #262c35;
    --line: #353d48;
    --accent: #3987e5;
    --accent-ink: #86b6ef;
    --accent-soft: rgba(57, 135, 229, 0.16);
    --s1: #3987e5;
    --s2: #d95926;
    --s2-soft: rgba(217, 89, 38, 0.18);
    --s3: #199e70;
    --s4: #c98500;
    --track: #232b36;
    --good-text: #0ca30c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -16px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); padding-block: 0 48px; }
  a { color: var(--accent-ink); }
  h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 600; }
  h2 { font-size: 15px; letter-spacing: -0.01em; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .mono { font-family: var(--mono); }
  .num { font-variant-numeric: tabular-nums; }

  /* Top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-block: 18px 14px; border-bottom: 1px solid var(--hair); }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 { font-size: 18px; letter-spacing: -0.02em; }
  .brand .sub { color: var(--ink-2); }
  .topmeta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--hair); background: var(--surface); font-family: var(--mono); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .chip.phase { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .chip.ok .dot { background: var(--good); }
  .chip.bad .dot { background: var(--crit); }
  .chip.warn .dot { background: var(--warn); }

  /* Mission strip */
  .mission { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 28px; align-items: stretch; padding-block: 28px 8px; }
  .hero { display: flex; flex-direction: column; gap: 4px; }
  .hero .figure { font-size: 72px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; }
  .hero .figure small { font-size: 28px; color: var(--ink-2); font-weight: 500; margin-left: 2px; }
  .hero .caption { color: var(--ink-2); }
  .hero .caption strong { color: var(--ink); font-weight: 500; }
  .rail-wrap { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
  .rail { display: flex; gap: 3px; height: 14px; }
  .rail .seg { position: relative; background: var(--track); border-radius: 3px; overflow: hidden; }
  .rail .seg .fill { position: absolute; inset: 0 auto 0 0; background: var(--s1); }
  .rail .seg.current .fill { background: var(--s2); }
  .rail .seg.current::after { content: ""; position: absolute; inset: 0; border: 2px solid var(--s2); border-radius: 3px; animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .rail .seg.current::after { animation: none; opacity: 0.8; } }
  .rail-labels { display: flex; gap: 3px; }
  .rail-labels div { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rail-labels div b { color: var(--ink-2); font-weight: 500; }
  .rail-labels div.current b { color: var(--s2); }
  .now { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
  .now .box { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 12px 14px; }
  .now .box .title { font-weight: 500; margin-top: 4px; }
  .now ol { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); }
  .now ol li { margin: 2px 0; }
  .now .code { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 6px; }

  /* KPI row */
  .kpis { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
  .tile { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tile .label { color: var(--ink-2); font-size: 12.5px; }
  .tile .value { font-size: 26px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; }
  .tile .value small { font-size: 14px; color: var(--muted); font-weight: 500; }
  .tile .delta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .tile .delta.up { color: var(--good-text); }
  .tile .delta.warn { color: var(--s2); }

  /* Grid */
  .grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; margin-top: 20px; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .card { background: var(--surface); border: 1px solid var(--hair); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .card-head .meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }

  /* Roadmap */
  .phase { border-top: 1px solid var(--hair); }
  .phase:first-of-type { border-top: 0; }
  .phase summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 44px minmax(0, 1fr) 150px 64px 78px; gap: 12px; align-items: center; padding: 11px 0; }
  .phase summary::-webkit-details-marker { display: none; }
  .phase summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .phase .code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .phase.current .code { color: var(--s2); font-weight: 500; }
  .phase.done .code { color: var(--accent-ink); }
  .phase .name { font-weight: 500; min-width: 0; }
  .phase .name .goal { display: block; font-weight: 400; font-size: 12px; color: var(--muted); white-space: normal; margin-top: 1px; }
  .stack { display: flex; gap: 2px; height: 10px; border-radius: 3px; overflow: hidden; background: var(--track); }
  .stack i { display: block; height: 100%; }
  .stack .d { background: var(--s1); }
  .stack .g { background: var(--s2); }
  .phase .count { font-family: var(--mono); font-size: 12px; color: var(--ink-2); text-align: right; }
  .phase .dur { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-align: right; }
  .tasks { margin: 0 0 12px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 1px; }
  .tasks li { display: grid; grid-template-columns: 18px 46px minmax(0, 1fr); gap: 10px; align-items: start; padding: 5px 0 5px 4px; border-radius: 6px; }
  .tasks li .glyph { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); margin-top: 3px; position: relative; }
  .tasks li.done .glyph { background: var(--s1); border-color: var(--s1); }
  .tasks li.done .glyph::after { content: ""; position: absolute; left: 4px; top: 1px; width: 3px; height: 7px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .tasks li.doing .glyph { border-color: var(--s2); }
  .tasks li.doing .glyph::after { content: ""; position: absolute; inset: 2.5px; border-radius: 50%; background: var(--s2); }
  .tasks li .tid { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .tasks li.doing .tid { color: var(--s2); }
  .tasks li.done .tt { color: var(--ink-2); }
  .tasks li.doing .tt { font-weight: 500; }
  .tasks li .when { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); }

  /* Charts */
  .chart { position: relative; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
  .chart .axis { stroke: var(--line); stroke-width: 1; }
  .chart .grid { stroke: var(--hair); stroke-width: 1; }
  .chart .ref { stroke: var(--line); stroke-width: 1; }
  .chart .line { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .area { fill: var(--s1); opacity: 0.1; }
  .chart .dot { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .chart .lbl { fill: var(--ink); font-weight: 500; }
  .chart .bar { fill: var(--s1); }
  .chart .bar:hover, .chart .bar.hot { fill: var(--accent-ink); }
  .chart .bar-lbl { fill: var(--ink-2); }
  .chart .cat { fill: var(--ink-2); font-family: var(--sans); font-size: 12px; }
  .chart .xhair { stroke: var(--line); stroke-width: 1; }
  .chart .hit { fill: transparent; }
  .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }

  /* Meter */
  .meter { height: 10px; border-radius: 3px; background: var(--track); overflow: hidden; display: flex; gap: 2px; }
  .meter i { display: block; height: 100%; }
  .meter .p { background: var(--s1); }
  .meter .f { background: var(--crit); }
  .meter .s { background: var(--s4); }
  .test-row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 8px; }
  .test-row .big { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .test-row .big small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .suites { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .suites li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .suites li span:last-child { color: var(--muted); }
  .suites li.bad span:last-child { color: var(--crit); }

  /* Env chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips .chip b { font-weight: 500; color: var(--ink); }

  /* Surface lists */
  .surface { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .surface h3 { font-size: 12.5px; color: var(--ink-2); font-weight: 500; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .surface h3 span { font-family: var(--mono); color: var(--muted); font-weight: 400; }
  .surface ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
  .surface li { font-family: var(--mono); font-size: 12px; color: var(--ink); padding: 3px 8px; background: var(--surface-2); border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Risks */
  .risks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .risks li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; }
  .risks .sev { width: 12px; height: 12px; border-radius: 3px; margin-top: 4px; }
  .risks .sev.warning { background: var(--warn); }
  .risks .sev.critical { background: var(--crit); }
  .risks .sev.info { background: var(--s1); }
  .risks .rt { font-weight: 500; }
  .risks .rd { color: var(--ink-2); font-size: 13px; }
  .risks .sev-label { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-left: 6px; }

  /* Architecture map */
  .arch svg { width: 100%; height: auto; display: block; }
  .arch .node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
  .arch .node.done rect { fill: var(--accent-soft); stroke: var(--s1); }
  .arch .node.doing rect { fill: var(--s2-soft); stroke: var(--s2); }
  .arch .node.todo rect { stroke-dasharray: 4 3; }
  .arch .node text { font-family: var(--sans); font-size: 12px; fill: var(--ink); }
  .arch .node.todo text { fill: var(--ink-2); }
  .arch .node .sub { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
  .arch .edge { fill: none; stroke: var(--line); stroke-width: 1.2; }
  .arch .edge.live { stroke: var(--s1); }
  .arch .node { cursor: default; }
  .arch .node:hover rect { stroke-width: 2; }
  .arch .db path, .arch .db ellipse { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
  .arch .db.done path, .arch .db.done ellipse { fill: var(--accent-soft); stroke: var(--s1); }
  .arch .db.doing path, .arch .db.doing ellipse { fill: var(--s2-soft); stroke: var(--s2); }
  .arch .db.todo path, .arch .db.todo ellipse { stroke-dasharray: 4 3; }
  .arch-legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
  .arch-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .arch-legend i { width: 14px; height: 10px; border-radius: 2px; border: 1.2px solid var(--line); display: inline-block; }
  .arch-legend i.done { background: var(--accent-soft); border-color: var(--s1); }
  .arch-legend i.doing { background: var(--s2-soft); border-color: var(--s2); }
  .arch-legend i.todo { border-style: dashed; }

  /* Log */
  .log { margin: 0; padding: 0; list-style: none; }
  .log li { display: grid; grid-template-columns: 52px 46px 16px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-top: 1px solid var(--hair); align-items: start; }
  .log li:first-child { border-top: 0; }
  .log .t { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .log .p { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
  .log .e { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--line); }
  .log .e.done { background: var(--s1); }
  .log .e.start { background: var(--s2); }
  .log .e.note { background: var(--s4); }
  .log .n { color: var(--ink); }
  .log .n b { font-weight: 500; font-family: var(--mono); font-size: 12px; color: var(--ink-2); margin-right: 6px; }

  /* Tooltip */
  #tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--page); padding: 7px 10px; border-radius: 7px; font-size: 12px; line-height: 1.4; box-shadow: var(--shadow); max-width: 280px; }
  #tip b { font-weight: 600; display: block; font-size: 13px; }
  #tip .k { display: inline-block; width: 10px; height: 2px; vertical-align: middle; margin-right: 6px; background: var(--s1); }

  .footer { margin-top: 24px; color: var(--muted); font-size: 12px; font-family: var(--mono); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  @media (max-width: 1180px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 900px) {
    .mission { grid-template-columns: 1fr; gap: 18px; }
    .grid { grid-template-columns: 1fr; }
    .phase summary { grid-template-columns: 40px minmax(0, 1fr) 90px 54px; }
    .phase .dur { display: none; }
  }
  @media (max-width: 560px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .now { grid-template-columns: 1fr; }
    .hero .figure { font-size: 56px; }
    .log li { grid-template-columns: 48px 16px minmax(0, 1fr); }
    .log .p { display: none; }
  }
</style>

<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <h1>FinMCP</h1>
      <span class="sub">Build console</span>
    </div>
    <div class="topmeta" id="topmeta"></div>
  </header>

  <section class="mission">
    <div class="hero" id="hero"></div>
    <div class="rail-wrap">
      <div class="eyebrow">Roadmap &middot; weighted by phase effort</div>
      <div class="rail" id="rail"></div>
      <div class="rail-labels" id="rail-labels"></div>
      <div class="now" id="now"></div>
    </div>
  </section>

  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="col">
      <article class="card">
        <div class="card-head">
          <h2>Phases and tasks</h2>
          <div class="legend"><span><i style="background:var(--s1)"></i>Done</span><span><i style="background:var(--s2)"></i>In progress</span><span><i style="background:var(--track)"></i>Not started</span></div>
        </div>
        <div id="roadmap"></div>
      </article>
      <article class="card arch">
        <div class="card-head">
          <h2>Architecture map</h2>
          <div class="arch-legend"><span><i class="done"></i>Built</span><span><i class="doing"></i>In progress</span><span><i class="todo"></i>Planned</span></div>
        </div>
        <div id="arch"></div>
      </article>
      <article class="card">
        <div class="card-head"><h2>Activity log</h2><span class="meta" id="log-meta"></span></div>
        <ul class="log" id="log"></ul>
      </article>
    </div>
    <div class="col">
      <article class="card chart">
        <div class="card-head"><h2>Tasks completed over time</h2><span class="meta" id="burnup-meta"></span></div>
        <div id="burnup"></div>
      </article>
      <article class="card chart">
        <div class="card-head"><h2>Code by layer</h2><span class="meta" id="loc-meta"></span></div>
        <div id="loc"></div>
      </article>
      <article class="card">
        <div class="card-head"><h2>Test suite</h2><span class="meta" id="tests-meta"></span></div>
        <div id="tests"></div>
      </article>
      <article class="card">
        <div class="card-head"><h2>MCP surface</h2><span class="meta" id="mcp-meta"></span></div>
        <div id="mcp"></div>
      </article>
      <article class="card">
        <div class="card-head"><h2>Environment</h2><span class="meta" id="env-meta"></span></div>
        <div class="chips" id="env"></div>
      </article>
      <article class="card">
        <div class="card-head"><h2>Risks and notes</h2></div>
        <ul class="risks" id="risks"></ul>
      </article>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>
</div>
<div id="tip" hidden></div>

<script>
(function () {
  const DATA = window.__DATA__;
  const plan = DATA.plan;
  const vit = DATA.vitals;
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const svgNS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs) => { const n = document.createElementNS(svgNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };

  // ---------- burn-up chart ----------
  (function burnup() {
    const host = $("burnup");
    const W = 520, H = 220, padL = 34, padR = 40, padT = 18, padB = 28;
    const pts = [{ t: started, y: 0, label: "Session start" }];
    const sorted = doneEvents.slice().sort((a, b) => new Date(a.ts) - new Date(b.ts));
    sorted.forEach((e, i) => { const task = allTasks.find((t) => t.id === e.task); pts.push({ t: new Date(e.ts), y: i + 1, label: e.task + " \u00b7 " + (task ? task.title : ""), note: e.note }); });
    pts.push({ t: now, y: done, label: "Now", note: "" });
    const t0 = +started, t1 = Math.max(+now, t0 + 30 * 60000);
    const yMax = total;
    const x = (t) => padL + (W - padL - padR) * ((+t - t0) / (t1 - t0));
    const y = (v) => padT + (H - padT - padB) * (1 - v / yMax);
    const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Cumulative tasks completed over time" });
    const yTicks = [0, 10, 20, 30, 40].filter((v) => v <= yMax);
    yTicks.forEach((v) => { svg.appendChild(svgEl("line", { x1: padL, x2: W - padR, y1: y(v), y2: y(v), class: v === 0 ? "axis" : "grid" })); const t = svgEl("text", { x: padL - 6, y: y(v) + 4, "text-anchor": "end" }); t.textContent = String(v); svg.appendChild(t); });
    const refT = svgEl("text", { x: W - padR, y: y(yMax) - 5, "text-anchor": "end" }); refT.textContent = total + " tasks total"; svg.appendChild(refT);
    // x ticks: every 30 min or hour
    const span = t1 - t0; const step = span > 4 * 3600000 ? 3600000 : span > 90 * 60000 ? 1800000 : 600000;
    for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) { const tt = svgEl("text", { x: x(t), y: H - 8, "text-anchor": "middle" }); tt.textContent = fmtTime(new Date(t)); svg.appendChild(tt); }
    // step path
    let dLine = "", dArea = "M" + x(pts[0].t) + "," + y(0);
    pts.forEach((p, i) => { const px = x(p.t), py = y(p.y); if (i === 0) { dLine += "M" + px + "," + py; dArea += " L" + px + "," + py; } else { const prev = pts[i - 1]; dLine += " L" + px + "," + y(prev.y) + " L" + px + "," + py; dArea += " L" + px + "," + y(prev.y) + " L" + px + "," + py; } });
    dArea += " L" + x(pts[pts.length - 1].t) + "," + y(0) + " Z";
    svg.appendChild(svgEl("path", { d: dArea, class: "area" }));
    svg.appendChild(svgEl("path", { d: dLine, class: "line" }));
    const last = pts[pts.length - 1];
    svg.appendChild(svgEl("circle", { cx: x(last.t), cy: y(last.y), r: 4.5, class: "dot" }));
    const lbl = svgEl("text", { x: x(last.t) + 8, y: y(last.y) + 4, class: "lbl" }); lbl.textContent = last.y + " done"; svg.appendChild(lbl);
    // crosshair + hit
    const xh = svgEl("line", { x1: 0, x2: 0, y1: padT, y2: H - padB, class: "xhair", visibility: "hidden" }); svg.appendChild(xh);
    const hit = svgEl("rect", { x: padL, y: 0, width: W - padL - padR, height: H, class: "hit" }); svg.appendChild(hit);
    hit.addEventListener("pointermove", (e) => {
      const rect = svg.getBoundingClientRect(); const mx = (e.clientX - rect.left) * (W / rect.width);
      const tAt = t0 + (t1 - t0) * ((mx - padL) / (W - padL - padR));
      let best = pts[0]; for (const p of pts) if (+p.t <= tAt) best = p;
      xh.setAttribute("x1", x(best.t)); xh.setAttribute("x2", x(best.t)); xh.setAttribute("visibility", "visible");
      showTip(e, fmtTime(best.t) + " \u00b7 " + best.y + " of " + total + " done", [{ key: "var(--s1)", text: best.label }].concat(best.note ? [{ text: best.note }] : []));
    });
    hit.addEventListener("pointerleave", () => { xh.setAttribute("visibility", "hidden"); hideTip(); });
    host.appendChild(svg);
    const rate = done > 0 ? (now - started) / done : 0;
    $("burnup-meta").textContent = done ? "avg " + fmtDur(rate) + " per task" : "no tasks closed yet";
  })();

      res: { x: 700, y: 332, w: 160, h: 40, label: "Resources", sub: "categories \u00b7 transactions \u00b7 summaries", tasks: ["P1.9"] },
      prm: { x: 700, y: 384, w: 160, h: 40, label: "Prompts", sub: "monthly review", tasks: ["P1.10"] },
      ocr: { x: 910, y: 20, w: 130, h: 40, label: "OCR / parsing", sub: "tesseract \u00b7 pdfplumber \u00b7 SMS", tasks: ["P2.2", "P2.3", "P2.4"] },
      llm: { x: 910, y: 72, w: 130, h: 40, label: "LLM provider", sub: "Anthropic + fallback", tasks: ["P1.4"] },
      db: { x: 910, y: 176, w: 130, h: 64, label: "SQLite", sub: "schema \u00b7 seed", tasks: ["P1.1", "P1.2", "P1.3"], cyl: true },
    };
    const E = [["ui", "api"], ["api", "agent"], ["agent", "server"], ["server", "t_import"], ["server", "t_cat"], ["server", "t_query"], ["server", "t_sum"], ["server", "t_add"], ["server", "t_alert"], ["server", "res"], ["server", "prm"], ["t_import", "ocr"], ["t_cat", "llm"], ["t_query", "llm"], ["t_import", "db"], ["t_query", "db"], ["t_sum", "db"], ["t_add", "db"], ["t_alert", "db"], ["res", "db"]];
    const W = 1060, H = 444;
    const svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "Architecture map with build status per component" });
    const st = {}; for (const k in N) st[k] = status(N[k].tasks);
    E.forEach(([a, b]) => {
      const A = N[a], B = N[b];
      const x1 = A.x + A.w, y1 = A.y + A.h / 2, x2 = B.x, y2 = B.y + B.h / 2;
      const c = (x2 - x1) * 0.5;
      const p = svgEl("path", { d: "M" + x1 + "," + y1 + " C" + (x1 + c) + "," + y1 + " " + (x2 - c) + "," + y2 + " " + x2 + "," + y2, class: "edge" + (st[a] === "done" && st[b] === "done" ? " live" : "") });
      svg.appendChild(p);
    });
    for (const k in N) {
      const n = N[k]; const g = svgEl("g", { class: "node " + st[k] + (n.cyl ? " db" : ""), tabindex: "0" });
      if (n.cyl) {
        const rx = n.w / 2, ry = 8;
        g.appendChild(svgEl("path", { d: "M" + n.x + "," + (n.y + ry) + " a" + rx + "," + ry + " 0 0 0 " + n.w + ",0 v" + (n.h - 2 * ry) + " a" + rx + "," + ry + " 0 0 1 " + (-n.w) + ",0 z" }));
        g.appendChild(svgEl("ellipse", { cx: n.x + rx, cy: n.y + ry, rx: rx, ry: ry }));
      } else {
        g.appendChild(svgEl("rect", { x: n.x, y: n.y, width: n.w, height: n.h, rx: 6 }));
      }
      const t = svgEl("text", { x: n.x + n.w / 2, y: n.y + (n.cyl ? 34 : 18), "text-anchor": "middle" }); t.textContent = n.label; g.appendChild(t);
      const s = svgEl("text", { x: n.x + n.w / 2, y: n.y + (n.cyl ? 50 : 32), "text-anchor": "middle", class: "sub" }); s.textContent = n.sub; g.appendChild(s);
      const show = (e) => showTip(e, n.label, n.tasks.map((id) => { const tk = allTasks.find((t) => t.id === id); return { key: tk.status === "done" ? "var(--s1)" : tk.status === "doing" ? "var(--s2)" : "var(--track)", text: id + " " + (tk.status === "done" ? "done" : tk.status === "doing" ? "in progress" : "planned") + " \u00b7 " + tk.title }; }));
      g.addEventListener("pointermove", show); g.addEventListener("pointerleave", hideTip);
      g.addEventListener("focus", (e) => { const r = g.getBoundingClientRect(); show({ clientX: r.left + r.width / 2, clientY: r.bottom }); }); g.addEventListener("blur", hideTip);
      svg.appendChild(g);
    }
    host.appendChild(svg);
  })();

  // ---------- log ----------
  (function log() {
    const host = $("log");
    const entries = plan.log.slice().sort((a, b) => new Date(b.ts) - new Date(a.ts));
    entries.forEach((e) => {
      const li = el("li");
      li.appendChild(el("span", "t", fmtTime(new Date(e.ts))));
      li.appendChild(el("span", "p", e.phase || ""));
      li.appendChild(el("span", "e " + e.event));
      const n = el("div", "n"); if (e.task) n.appendChild(el("b", null, e.task + " " + (e.event === "done" ? "closed" : e.event === "start" ? "started" : e.event))); n.appendChild(document.createTextNode(e.note || "")); li.appendChild(n);
      host.appendChild(li);
    });
    $("log-meta").textContent = entries.length + " events";
  })();

  $("footer").appendChild(el("span", null, "FinMCP build console \u00b7 generated " + now.toLocaleString() + " \u00b7 regenerate with python progress/build.py"));
  $("footer").appendChild(el("span", null, plan.tagline));
  document.addEventListener("pointermove", (e) => { if (!tip.hidden) moveTip(e); });
})();
</script>
